name: Supabase keep-alive

# Keeps the NK Invoice backend (Supabase project ydjswmzjqlvxurgtjwni) awake.
#
# Free Supabase projects pause after about 7 days of low database activity.
# Supabase's own wording is "a few user requests to the database each day over
# the previous week", so this runs one real query a day rather than a week.
#
# It lives in this public repo, not the private app repo, because GitHub
# Actions is free for public repos and the app repo's Actions are blocked by
# billing. Nothing secret is here: the anon key below ships inside the app
# binary, and row-level security, not this key, protects the data.

on:
  schedule:
    # 07:23 UTC daily. Deliberately off the hour: GitHub's scheduler is busiest
    # at :00 and runs queued then are the ones most likely to be delayed.
    - cron: '23 7 * * *'
  workflow_dispatch:

# actions: write lets the last step re-enable this workflow. GitHub turns off
# scheduled workflows in public repos after 60 days with no repo activity.
permissions:
  actions: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Query the database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL: https://ydjswmzjqlvxurgtjwni.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkanN3bXpqcWx2eHVyZ3Rqd25pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2Nzg5NzMsImV4cCI6MjEwMTI1NDk3M30.hmL6hJ0cxqBnsO2FqLODCHIAijEKryTNbczZ3nYcRbA

    steps:
      - name: Ping the database
        run: |
          set -uo pipefail

          # A genuine PostgREST -> Postgres round trip. public.keepalive()
          # (app repo migration 0004) returns 1 and reads no data; the anon
          # role has no access to the tables themselves.
          url="${SUPABASE_URL}/rest/v1/rpc/keepalive"

          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 30 -o /tmp/body.txt -w '%{http_code}' \
              -X POST "$url" \
              -H "Content-Type: application/json" \
              -d '{}' \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || echo 000)

            if [ "$code" = "200" ]; then
              echo "Postgres answered: HTTP $code, body $(head -c 80 /tmp/body.txt)"
              echo "### Supabase is awake (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Attempt $attempt failed: HTTP $code — $(head -c 300 /tmp/body.txt 2>/dev/null)"
            [ "$attempt" -lt 3 ] && sleep 30
          done

          # Failing the job is the point: GitHub emails on a failed run, so a
          # project that paused anyway surfaces instead of going quiet.
          echo "::error::No 200 from Supabase after 3 attempts (last: HTTP $code). The project may be paused — check https://supabase.com/dashboard/project/ydjswmzjqlvxurgtjwni"
          exit 1

      - name: Keep this schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
